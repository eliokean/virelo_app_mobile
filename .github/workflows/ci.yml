name: Flutter Mobile CI/CD

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx3072m -XX:MaxMetaspaceSize=512m' -Dorg.gradle.parallel=true"

jobs:
  build-and-release:
    name: Build & Release Mobile APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd "$GITHUB_WORKSPACE" && flutter pub get
          cd "$GITHUB_WORKSPACE/packages/virelo_core" && flutter pub get
          cd "$GITHUB_WORKSPACE/packages/virelo_design_system" && flutter pub get
          cd "$GITHUB_WORKSPACE/apps/virelo_client" && flutter pub get
          cd "$GITHUB_WORKSPACE/apps/virelo_marchand" && flutter pub get

      - name: Provision Android signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          STORE_PASSWORD="${STORE_PASSWORD:-vireloPFE2026}"
          KEY_PASSWORD="${KEY_PASSWORD:-vireloPFE2026}"
          KEY_ALIAS="${KEY_ALIAS:-virelo}"
          for app in virelo_client virelo_marchand; do
            A="$GITHUB_WORKSPACE/apps/$app/android"
            KS="$A/app/upload-keystore.jks"
            if [ -n "$KEYSTORE_B64" ]; then
              echo "$KEYSTORE_B64" | base64 -d > "$KS"
              echo "[$app] keystore décodé depuis les secrets"
            else
              keytool -genkeypair -v -keystore "$KS" \
                -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
                -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Virelo, OU=PFE, O=ESATIC, L=Abidjan, C=CI"
              echo "[$app] keystore éphémère généré (aucun secret configuré)"
            fi
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
            } > "$A/key.properties"
          done

      - name: Build Virelo Pay Client APK (Release)
        run: |
          cd "$GITHUB_WORKSPACE/apps/virelo_client"
          flutter build apk --release --android-skip-build-dependency-validation --dart-define=API_BASE_URL=https://backend-virelo.onrender.com

      - name: Build Virelo Terminal Marchand APK (Release)
        run: |
          cd "$GITHUB_WORKSPACE/apps/virelo_marchand"
          flutter build apk --release --android-skip-build-dependency-validation --dart-define=API_BASE_URL=https://backend-virelo.onrender.com

      - name: Prepare APK Release Artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release_artifacts"
          cp "$GITHUB_WORKSPACE/apps/virelo_client/build/app/outputs/flutter-apk/app-release.apk" "$GITHUB_WORKSPACE/release_artifacts/virelo-pay-client.apk"
          cp "$GITHUB_WORKSPACE/apps/virelo_marchand/build/app/outputs/flutter-apk/app-release.apk" "$GITHUB_WORKSPACE/release_artifacts/virelo-terminal-marchand.apk"

      - name: Create GitHub Release and Upload APKs
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Virelo Mobile Release {0}', github.ref_name) || 'Virelo Mobile Latest Release' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_artifacts/virelo-pay-client.apk
            release_artifacts/virelo-terminal-marchand.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
